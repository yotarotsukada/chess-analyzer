# Fly.io の設定（D16、D26、ADR 0001）。アプリ名は `fly launch --no-deploy` で作成したものに合わせる。
app = "chess-analyzer"
primary_region = "nrt"

[build]

[deploy]
  release_command = "pnpm db:migrate"

[processes]
  web = "pnpm start"
  worker = "pnpm worker"

[env]
  PORT = "3000"
  ENGINE_DEPTH = "18"
  ENGINE_MULTIPV = "3"

[http_service]
  internal_port = 3000
  force_https = true
  processes = ["web"]
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

# Worker は Web が Fly Machines API で起動し、キューが空になると自分で終了する（D42、D51）。
[[restart]]
  policy = "never"
  processes = ["worker"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web"]

[[vm]]
  size = "performance-1x"
  memory = "2gb"
  processes = ["worker"]
